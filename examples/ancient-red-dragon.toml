[[legendary_action]]
name = "Wing Attack (Costs 2 Actions)"
preset = ""
description = "{{MON}} beats its wings. Each creature within 15 feet of {{MON}} must succeed on a DC 25 Dexterity saving throw or take {{STR 2D6}} bludgeoning damage and be knocked prone. {{MON}} can then fly up to half its flying speed."
